name: Deploy Proyecto 1 to GitHub Pages

on:
  push:
    branches: [task/brayan]
    paths:
      - 'el-trueno-pay/proyecto_1/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: el-trueno-pay/proyecto_1
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: el-trueno-pay/proyecto_1/dist
          destination_dir: proyecto_1
